name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tofu:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - name: Formatting (treefmt)
        run: devenv shell -- treefmt --ci
      - name: tofu validate and tflint
        # No backend and no credentials: validate needs only the provider schemas.
        run: |
          devenv shell -- bash -e -s <<'EOF'
          for dir in github openbao; do
            tofu -chdir="$dir" init -backend=false -input=false
            tofu -chdir="$dir" validate
            tflint --chdir="$dir" --config="$PWD/.tflint.hcl"
          done
          EOF

  workflows:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - name: actionlint
        run: devenv shell -- actionlint
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: devenv shell -- zizmor --format=github .github/workflows

  # Single required status check for the branch ruleset.
  final-check:
    if: always()
    needs: [tofu, workflows]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to have succeeded
        env:
          TOFU: ${{ needs.tofu.result }}
          WORKFLOWS: ${{ needs.workflows.result }}
        run: test "$TOFU" = success && test "$WORKFLOWS" = success
